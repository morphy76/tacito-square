name: Manual Release Dispatch

on:
  workflow_dispatch:
    inputs:
      target_type:
        description: 'Target to release'
        required: true
        type: choice
        options:
          - component
          - helm-chart
      target_name:
        description: 'Component or Chart Name (e.g. agent, keeper, operator, bff, ui-configurator, ollama, tacito-square, tacito-agent, tacito-square-infra)'
        required: true
        type: string
      version:
        description: 'Semantic Version to release (e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release-manual-component:
    name: Manual Release Component (${{ inputs.target_name }})
    if: inputs.target_type == 'component'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Git Tag
        run: |
          TAG="${{ inputs.target_name }}-v${{ inputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping tag creation."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release ${{ inputs.target_name }} v${{ inputs.version }}"
            git push origin "$TAG"
          fi

      - name: Setup Go
        if: inputs.target_name != 'ollama'
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Build Static Binaries
        if: inputs.target_name == 'agent' || inputs.target_name == 'keeper' || inputs.target_name == 'operator' || inputs.target_name == 'bff'
        run: |
          mkdir -p dist
          for target in "linux/amd64" "linux/arm64" "darwin/arm64"; do
            os=$(echo $target | cut -d'/' -f1)
            arch=$(echo $target | cut -d'/' -f2)
            bin_name="${{ inputs.target_name }}-${os}-${arch}"
            echo "Compiling $bin_name..."
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -ldflags="-s -w" -o "dist/$bin_name" "./cmd/${{ inputs.target_name }}"
          done
          cd dist && sha256sum * > checksums.txt

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tools/docker/Dockerfile.${{ inputs.target_name }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tacito-square/${{ inputs.target_name }}:${{ inputs.version }}
            ghcr.io/${{ github.repository_owner }}/tacito-square/${{ inputs.target_name }}:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.target_name }}-v${{ inputs.version }}
          name: "${{ inputs.target_name }} v${{ inputs.version }}"
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-manual-helm:
    name: Manual Release Helm Chart (${{ inputs.target_name }})
    if: inputs.target_type == 'helm-chart'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Git Tag
        run: |
          TAG="chart-${{ inputs.target_name }}-v${{ inputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping tag creation."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release Helm Chart ${{ inputs.target_name }} v${{ inputs.version }}"
            git push origin "$TAG"
          fi

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: 'v3.17.0'

      - name: Package Chart
        run: |
          mkdir -p dist
          helm package "tools/helm/${{ inputs.target_name }}" --destination dist

      - name: Log in to GHCR OCI Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Helm Chart to GHCR OCI
        run: |
          PKG="dist/${{ inputs.target_name }}-${{ inputs.version }}.tgz"
          helm push "$PKG" "oci://ghcr.io/${{ github.repository_owner }}/tacito-square/charts"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: chart-${{ inputs.target_name }}-v${{ inputs.version }}
          name: "Helm Chart ${{ inputs.target_name }} v${{ inputs.version }}"
          generate_release_notes: true
          files: |
            dist/${{ inputs.target_name }}-${{ inputs.version }}.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
