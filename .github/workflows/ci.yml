name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-quality-and-test:
    name: Go Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m ./...

      - name: Check Test Tags Isolation
        run: make check-test-tags

      - name: Run Unit Tests with Race Detection
        run: go test ./internal/... -count=1 -race -v

      - name: Validate Escape Analysis
        run: make escape-analysis

  integration-and-contract-tests:
    name: Integration & Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Run Integration Tests (Testcontainers)
        run: go test ./... -tags=integration -count=1 -v

      - name: Run Contract Tests
        run: go test ./test/contract/... -tags=integration -count=1 -v

      - name: Run Operator Tests
        run: make test-operator

  ui-configurator:
    name: UI Configurator Quality & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'ui/configurator/package-lock.json'

      - name: Install Dependencies
        run: cd ui/configurator && npm ci

      - name: Lint UI
        run: cd ui/configurator && npm run lint

      - name: Test UI
        run: cd ui/configurator && npm run test

      - name: Build UI
        run: cd ui/configurator && npm run build

  helm-validation:
    name: Helm Charts Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.17.0'

      - name: Lint Infrastructure Chart
        run: make helm-infra-lint

      - name: Template Infrastructure Chart
        run: make helm-infra-template

      - name: Template Application Chart
        run: make helm-template

      - name: Template Standalone Agent Chart
        run: make helm-template-agent

      - name: Run Standalone Agent Test Suite
        run: make test-helm-agent

  docker-dry-run:
    name: Dockerfile Build Verification (Dry Run)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - agent
          - keeper
          - operator
          - bff
          - ui-configurator
          - ollama
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Dockerfile (${{ matrix.component }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/docker/Dockerfile.${{ matrix.component }}
          platforms: linux/amd64
          push: false

  security-scan:
    name: Security Vulnerability Scan (Govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
        continue-on-error: true
