# Tacito Agent — Standalone application Helm values
# This configuration runs a single agent statically in Kubernetes,
# completely independent of the dynamic Keeper lifecycle APIs and the Operator.

# --- Global / Registry overrides ---
global:
  imageRegistry: ""
  imagePullSecrets: []

# --- Deployment ---
replicaCount: 1

image:
  registry: ""
  name: "tacito-square/agent"
  tag: "0.1.0"
  pullPolicy: Never

# --- Container configuration ---
port: 8081
logLevel: trace

# --- Agent Metadata & Identity ---
agent:
  id: "00000000-0000-0000-0000-000000000000"
  name: "standalone-agent"
  tenantId: "default-tenant"
  communityRef: "standalone-community"

  # --- LLM Brain Configuration ---
  brain:
    provider: "openai"
    model: "gemini-2.5-flash-lite"
    endpoint: "https://generativelanguage.googleapis.com/v1beta/openai/"
    temperature: 0.7
    maxTokens: 512
    timeoutSeconds: 30
    circuit:
      failureThreshold: 3
      recoveryTimeoutSeconds: 60
    credentialsSecret:
      name: gemini-api-key
      key: api-key

  # --- System Prompt (structured JSON string) ---
  systemPrompt: |
    You are the Inquiry Coach, a specialized cognitive agent whose sole objective is to help the researcher explore, unpack, and understand a complex or unknown subject.
    Your goal is not to supply answers, but to elevate the researcher's own awareness and uncover their blind spots.
    
    ### Core Objective
    Formulate precise, thought-provoking questions that guide the researcher to articulate their understanding, identify assumptions, and clarify gaps in their knowledge.

    ### Guidelines for Inquiry
    1. **Socratic Inquiry:** Ask open-ended, analytical, and probing questions rather than explaining concepts or giving advice.
    2. **Identify Blind Spots:** Ask about unstated assumptions, counter-arguments, dependencies, and potential points of failure within the researcher's current mental model.
    3. **Dynamically Adapt:** Active listening is key. Build your questions directly on the researcher's previous responses to guide them in a progressive line of thinking.
    4. **Explore Alternative Perspectives:** Prompt the researcher to consider the subject from different angles (e.g., structural, historical, systemic, or opposite viewpoints).
    5. **Simplicity and Focus:** Keep your prompts concise and ask only one or two focused questions at a time to keep the researcher's thinking structured and engaged.

# --- Event Bus (NATS) ---
nats:
  url: "nats://ts-infra-nats:4222"

# --- Short-Term Memory (Redis) ---
redis:
  url: "redis://:tacito-redis-dev@ts-infra-redis-headless:6379"

# --- Long-Term Memory (Qdrant) ---
qdrant:
  url: "ts-infra-qdrant:6334"

# --- OpenTelemetry Tracing ---
otel:
  endpoint: "ts-infra-otel-collector:4317"

# --- Object Storage (S3/MinIO) ---
s3:
  url: "https://ts-infra-minio:9000"
  bucket: "tacito"
  region: ""

# --- Probes ---
livenessProbe:
  initialDelaySeconds: 1
  periodSeconds: 1
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 1
  periodSeconds: 1
  timeoutSeconds: 5
  failureThreshold: 3

# --- Resources ---
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# --- Node Placement ---
nodeSelector: {}
tolerations: []
affinity: {}

# --- Model Context Protocol Clients ---
mcpClients: []
