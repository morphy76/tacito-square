          "headers": {
            "Content-Type": ["application/json"]
          },
          "body": "{\"id\":\"chatcmpl-mock-2\",\"object\":\"chat.completion\",\"created\":1677652289,\"model\":\"gpt-4o\",\"choices\":[{\"index\":0,\"message\":{\"role\":\"assistant\",\"content\":\"{\\\"thought\\\":\\\"I have the math guidelines. The calculations are verified.\\\",\\\"final_answer\\\":\\\"Verified total pool size is 50.\\\"}\"},\"finish_reason\":\"stop\"}],\"usage\":{\"prompt_tokens\":25,\"completion_tokens\":20,\"total_tokens\":45}}"
