---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tacito-agent.fullname" . }}-mocks
  labels:
    {{- include "tacito-agent.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "tacito-agent.name" . }}-mocks
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "tacito-agent.name" . }}-mocks
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: mockserver
          image: "mockserver/mockserver:5.15.0"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1080
              name: http
          env:
            - name: MOCKSERVER_INITIALIZATION_JSON_PATH
              value: "/config/expectations.json"
          volumeMounts:
            - name: expectations-volume
              mountPath: "/config"
      volumes:
        - name: expectations-volume
          configMap:
            name: {{ include "tacito-agent.fullname" . }}-mocks-expectations

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tacito-agent.fullname" . }}-mocks
  labels:
    {{- include "tacito-agent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 1080
      targetPort: 1080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "tacito-agent.name" . }}-mocks
    app.kubernetes.io/instance: {{ .Release.Name }}
