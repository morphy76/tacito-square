{{- if .Values.agent.llm.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ default (printf "%s-llm" (include "tacito-agent.fullname" .)) .Values.agent.llm.credentialsSecret }}
  labels:
    {{- include "tacito-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.agent.llm.apiKey | quote }}
{{- end }}
