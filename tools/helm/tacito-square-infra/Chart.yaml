apiVersion: v2
name: tacito-square-infra
description: >-
  Tacito Square — Infrastructure Helm chart.
  Deploys all external dependencies (NATS, Redis, PostgreSQL, Qdrant,
  OpenTelemetry Collector, Keycloak, MinIO) as a self-contained release,
  separate from the application chart.
type: application
version: 0.1.0
appVersion: "0.1.0"
icon: https://raw.githubusercontent.com/morphy76/tacito-square/main/assets/icon.png

dependencies:
  - name: nats
    version: "1.2.*"
    repository: https://nats-io.github.io/k8s/helm/charts/
    condition: nats.enabled
  - name: redis
    version: "2.3.3"
    repository: https://groundhog2k.github.io/helm-charts/
    condition: redis.enabled
  - name: postgres
    version: "1.6.3"
    repository: https://groundhog2k.github.io/helm-charts/
    condition: postgresql.enabled
    alias: postgresql
  - name: qdrant
    version: "1.*"
    repository: https://qdrant.to/helm
    condition: qdrant.enabled
  - name: opentelemetry-collector
    version: "0.108.*"
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    condition: otel-collector.enabled
    alias: otel-collector
  - name: keycloakx
    version: "7.1.11"
    repository: https://codecentric.github.io/helm-charts
    condition: keycloak.enabled
    alias: keycloak
  - name: minio
    version: "5.4.0"
    repository: https://charts.min.io/
    condition: minio.enabled

