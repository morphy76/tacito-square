# Tacito Square — Infrastructure Helm values
# Dev-friendly defaults: all services enabled, no auth, small volumes.

# ── NATS (messaging backbone) ───────────────────────────
nats:
  enabled: true

# ── Redis (STM + cache) ─────────────────────────────────
redis:
  enabled: true
  useDeploymentWhenNonHA: true
  image:
    registry: docker.io
    repository: library/redis
    tag: alpine

# ── PostgreSQL (keeper persistence) ─────────────────────
postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: library/postgres
    tag: 16-alpine
  settings:
    superuser:
      value: postgres
    superuserPassword:
      value: tacito-dev
  userDatabase:
    name:
      value: tacito_keeper
    user:
      value: keeper
    password:
      value: keeper-dev
  storage:
    requestedSize: 1Gi

# ── Qdrant (vector storage) ─────────────────────────────
qdrant:
  enabled: true
  replicaCount: 1

# ── OpenTelemetry Collector (tracing) ───────────────────
otel-collector:
  enabled: true
  mode: deployment
  image:
    repository: otel/opentelemetry-collector-contrib
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
    exporters:
      debug:
        verbosity: detailed
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]

# ── Keycloak (OIDC provider) ────────────────────────────
keycloak:
  enabled: true
  image:
    repository: quay.io/keycloak/keycloak
    tag: "24.0.0"
  command:
    - "/opt/keycloak/bin/kc.sh"
  args:
    - "start-dev"
    - "--import-realm"
  database:
    vendor: postgres
    hostname: ts-infra-postgresql
    port: 5432
    database: tacito_keeper
    username: keeper
    password: keeper-dev
  extraEnv: |
    - name: KEYCLOAK_ADMIN
      value: "admin"
    - name: KEYCLOAK_ADMIN_PASSWORD
      value: "admin-dev"
  extraVolumes: |
    - name: keycloak-realm
      configMap:
        name: keycloak-realm
  extraVolumeMounts: |
    - name: keycloak-realm
      mountPath: /opt/keycloak/data/import
      readOnly: true

# ── MinIO (S3-compatible, opt-in) ───────────────────────
minio:
  enabled: false
  rootUser: "tacito-dev"
  rootPassword: "tacito-dev-secret"
  buckets:
    - name: tacito-artifacts
      policy: public
      purge: false
  persistence:
    size: 5Gi
