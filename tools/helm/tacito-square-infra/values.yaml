# Tacito Square — Infrastructure Helm values
# Secured defaults: TLS everywhere, authenticated connections, auto-provisioned tenants.

# ── NATS (messaging backbone) ───────────────────────────
nats:
  enabled: true
  config:
    nats:
      tls:
        enabled: true
        secretName: ts-infra-tacito-square-infra-nats-tls
        cert: tls.crt
        key: tls.key
      authorization:
        token: "tacito-nats-dev-token"

# ── Redis (STM + cache) ─────────────────────────────────
redis:
  enabled: true
  useDeploymentWhenNonHA: true
  args:
    - "--tls-port"
    - "\"6479\""
    - "--port"
    - "\"6379\""
    - "--tls-cert-file"
    - "/tls/tls.crt"
    - "--tls-key-file"
    - "/tls/tls.key"
    - "--tls-ca-cert-file"
    - "/tls/ca.crt"
    - "--requirepass"
    - "tacito-redis-dev"
  extraRedisSecrets:
    - name: ts-infra-tacito-square-infra-redis-tls
      defaultMode: 0440
      mountPath: /tls

# ── PostgreSQL (keeper persistence) ─────────────────────
postgresql:
  enabled: true
  settings:
    superuser:
      value: postgres
    superuserPassword:
      value: tacito-dev
  userDatabase:
    name:
      value: tacito
    user:
      value: tacito
    password:
      value: tacito-dev
  customConfig: |
    ssl = on
    ssl_cert_file = '/tls/tls.crt'
    ssl_key_file = '/tls/tls.key'
    ssl_ca_file = '/tls/ca.crt'
  extraSecrets:
    - name: ts-infra-tacito-square-infra-pg-tls
      defaultMode: 0600
      mountPath: /tls
  storage:
    requestedSize: 1Gi

# ── Qdrant (vector storage) ─────────────────────────────
qdrant:
  enabled: true
  replicaCount: 1
  config:
    service:
      enable_tls: true
    tls:
      cert: /tls/tls.crt
      key: /tls/tls.key
      ca_cert: /tls/ca.crt
  extraSecrets:
    - name: ts-infra-tacito-square-infra-qdrant-tls
      defaultMode: 0600
      mountPath: /tls
  additionalVolumes:
    - name: qdrant-tls
      secret:
        secretName: ts-infra-tacito-square-infra-qdrant-tls
  additionalVolumeMounts:
    - name: qdrant-tls
      mountPath: /tls

# ── OpenTelemetry Collector (tracing) ───────────────────
otel-collector:
  enabled: true
  mode: deployment
  image:
    repository: otel/opentelemetry-collector-contrib
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
    exporters:
      debug:
        verbosity: detailed
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]

# ── Keycloak (OIDC provider) ────────────────────────────
keycloak:
  enabled: true
  command:
    - "/opt/keycloak/bin/kc.sh"
  args:
    - "start"
    - "--import-realm"
    - "--hostname-strict=false"
    - "--https-certificate-file=/tls/tls.crt"
    - "--https-certificate-key-file=/tls/tls.key"
    - "--http-enabled=true"
  database:
    vendor: postgres
    hostname: ts-infra-postgresql
    port: 5432
    database: tacito
    username: tacito
    password: tacito-dev
  extraEnv: |
    - name: KC_BOOTSTRAP_ADMIN_USERNAME
      value: "admin"
    - name: KC_BOOTSTRAP_ADMIN_PASSWORD
      value: "admin-dev"
  extraVolumes: |
    - name: keycloak-tls
      secret:
        secretName: ts-infra-tacito-square-infra-keycloak-tls
    - name: keycloak-realm
      configMap:
        name: keycloak-realm
  extraVolumeMounts: |
    - name: keycloak-tls
      mountPath: /tls
      readOnly: true
    - name: keycloak-realm
      mountPath: /opt/keycloak/data/import
      readOnly: true

# ── MinIO (S3-compatible) ───────────────────────────────
minio:
  enabled: true
  mode: standalone
  resources:
    requests:
      memory: "1Gi"
  rootUser: "tacito-dev"
  rootPassword: "tacito-dev-secret"
  buckets:
    - name: tacito
      policy: none
      purge: false
  tls:
    enabled: true
    certSecret: ts-infra-tacito-square-infra-minio-tls
    publicCrt: tls.crt
    privateKey: tls.key
  persistence:
    size: 2Gi
