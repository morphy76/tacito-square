{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tacito-square-infra.fullname" . }}-pg-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tacito-square-infra.labels" . | nindent 4 }}
data:
  init-schema.sql: |
    -- Idempotent schema initialization for Tacito Square
    DO $$
    BEGIN
      -- Create schema if not exists
      IF NOT EXISTS (SELECT 1 FROM pg_namespace WHERE nspname = 'tacito') THEN
        CREATE SCHEMA tacito;
      END IF;

      -- Grant schema ownership to the tacito user
      ALTER SCHEMA tacito OWNER TO tacito;

      -- Set default search path
      ALTER ROLE tacito SET search_path TO tacito, public;
    END
    $$;
{{- end }}
