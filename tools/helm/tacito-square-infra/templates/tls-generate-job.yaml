apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tacito-square-infra.fullname" . }}-tls-generate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tacito-square-infra.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "tacito-square-infra.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "tacito-square-infra.fullname" . }}-tls-generate
      restartPolicy: Never
      containers:
        - name: tls-generate
          image: alpine:3.20
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command:
            - /bin/sh
            - -ce
            - |
              # Install dependencies
              apk add --no-cache openssl curl

              # Download kubectl
              KUBE_VERSION=$(curl -sL https://dl.k8s.io/release/stable.txt)
              curl -sLO "https://dl.k8s.io/release/${KUBE_VERSION}/bin/linux/amd64/kubectl"
              chmod +x kubectl
              mv kubectl /usr/local/bin/kubectl

              NAMESPACE="${NAMESPACE:-{{ .Release.Namespace }}}"
              RELEASE_NAME="{{ include "tacito-square-infra.fullname" . }}"
              CA_SECRET="${RELEASE_NAME}-ca-tls"

              # -------------------------------------------------------
              # Function: create_cert_secret
              # Args: secret_name, cn, san_dns_list (comma-separated)
              # -------------------------------------------------------
              create_cert_secret() {
                SECRET_NAME="$1"
                CN="$2"
                SAN="$3"

                echo ">>> Checking secret ${SECRET_NAME} ..."
                if kubectl get secret "${SECRET_NAME}" -n "${NAMESPACE}" >/dev/null 2>&1; then
                  echo "    Secret ${SECRET_NAME} already exists — skipping."
                  return
                fi

                echo "    Generating certificate for CN=${CN}, SAN=${SAN} ..."
                openssl genrsa -out /tmp/server.key 2048
                openssl req -new -key /tmp/server.key -out /tmp/server.csr -subj "/CN=${CN}"
                openssl x509 -req -in /tmp/server.csr \
                  -CA /tmp/ca.crt -CAkey /tmp/ca.key -CAcreateserial \
                  -out /tmp/server.crt -days 365 -sha256 \
                  -extfile <(echo "subjectAltName=${SAN}")

                kubectl create secret generic "${SECRET_NAME}" \
                  --from-file=tls.crt=/tmp/server.crt \
                  --from-file=tls.key=/tmp/server.key \
                  --from-file=ca.crt=/tmp/ca.crt \
                  -n "${NAMESPACE}"

                echo "    Secret ${SECRET_NAME} created."
                rm -f /tmp/server.key /tmp/server.csr /tmp/server.crt
              }

              # -------------------------------------------------------
              # Step 1: CA key + certificate
              # -------------------------------------------------------
              if kubectl get secret "${CA_SECRET}" -n "${NAMESPACE}" >/dev/null 2>&1; then
                echo ">>> CA secret ${CA_SECRET} already exists — extracting."
                kubectl get secret "${CA_SECRET}" -n "${NAMESPACE}" -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/ca.crt
                kubectl get secret "${CA_SECRET}" -n "${NAMESPACE}" -o jsonpath='{.data.tls\.key}' | base64 -d > /tmp/ca.key
              else
                echo ">>> Generating new CA ..."
                openssl genrsa -out /tmp/ca.key 4096
                openssl req -x509 -new -nodes -key /tmp/ca.key -sha256 -days 3650 \
                  -out /tmp/ca.crt -subj '/CN=tacito-infra-ca'

                kubectl create secret generic "${CA_SECRET}" \
                  --from-file=ca.crt=/tmp/ca.crt \
                  --from-file=tls.crt=/tmp/ca.crt \
                  --from-file=tls.key=/tmp/ca.key \
                  -n "${NAMESPACE}"
                echo "    CA secret ${CA_SECRET} created."
              fi

              # -------------------------------------------------------
              # Step 2: CA bundle ConfigMap (create or update)
              # -------------------------------------------------------
              CA_BUNDLE_CM="${RELEASE_NAME}-ca-bundle"
              echo ">>> Ensuring ConfigMap ${CA_BUNDLE_CM} ..."
              if kubectl get configmap "${CA_BUNDLE_CM}" -n "${NAMESPACE}" >/dev/null 2>&1; then
                echo "    ConfigMap ${CA_BUNDLE_CM} already exists."
              else
                kubectl create configmap "${CA_BUNDLE_CM}" \
                  --from-file=ca.crt=/tmp/ca.crt \
                  -n "${NAMESPACE}"
                echo "    ConfigMap ${CA_BUNDLE_CM} created."
              fi

              # -------------------------------------------------------
              # Step 3: Per-service TLS secrets
              # -------------------------------------------------------
              create_cert_secret \
                "${RELEASE_NAME}-pg-tls" \
                "${RELEASE_NAME}-postgresql" \
                "DNS:${RELEASE_NAME}-postgresql,DNS:${RELEASE_NAME}-postgresql.${NAMESPACE}.svc.cluster.local"

              create_cert_secret \
                "${RELEASE_NAME}-redis-tls" \
                "${RELEASE_NAME}-redis" \
                "DNS:${RELEASE_NAME}-redis,DNS:${RELEASE_NAME}-redis.${NAMESPACE}.svc.cluster.local"

              create_cert_secret \
                "${RELEASE_NAME}-keycloak-tls" \
                "${RELEASE_NAME}-keycloak-http" \
                "DNS:${RELEASE_NAME}-keycloak-http,DNS:${RELEASE_NAME}-keycloak-http.${NAMESPACE}.svc.cluster.local"

              create_cert_secret \
                "${RELEASE_NAME}-minio-tls" \
                "${RELEASE_NAME}-minio" \
                "DNS:${RELEASE_NAME}-minio,DNS:${RELEASE_NAME}-minio.${NAMESPACE}.svc.cluster.local"

              create_cert_secret \
                "${RELEASE_NAME}-nats-tls" \
                "${RELEASE_NAME}-nats" \
                "DNS:${RELEASE_NAME}-nats,DNS:${RELEASE_NAME}-nats.${NAMESPACE}.svc.cluster.local"

              create_cert_secret \
                "${RELEASE_NAME}-qdrant-tls" \
                "${RELEASE_NAME}-qdrant" \
                "DNS:${RELEASE_NAME}-qdrant,DNS:${RELEASE_NAME}-qdrant.${NAMESPACE}.svc.cluster.local"

              echo ">>> TLS certificate generation complete."
