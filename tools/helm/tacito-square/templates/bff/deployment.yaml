{{- if .Values.bff.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tacito-square.fullname" . }}-bff
  labels:
    {{- include "tacito-square.labels" (dict "component" "bff" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.bff.replicaCount }}
  selector:
    matchLabels:
      {{- include "tacito-square.selectorLabels" (dict "component" "bff" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tacito-square.selectorLabels" (dict "component" "bff" "context" .) | nindent 8 }}
    spec:
      containers:
        - name: bff
          image: {{ include "tacito-square.image" (dict "registry" .Values.bff.image.registry "name" .Values.bff.image.name "tag" .Values.bff.image.tag "global" .Values.global) }}
          imagePullPolicy: {{ .Values.bff.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.bff.service.port }}
              protocol: TCP
          env:
            - name: TS_BFF_LOG_LEVEL
              value: {{ .Values.bff.config.logLevel | quote }}
            - name: TS_BFF_PORT
              value: {{ .Values.bff.config.port | toString | quote }}
            - name: TS_BFF_BFF_UI_CONFIGURATOR_URL
              value: "http://{{ include "tacito-square.fullname" . }}-ui-configurator:{{ .Values.uiConfigurator.service.port }}"
            - name: TS_BFF_KEEPER_BASE_URL
              value: "http://{{ include "tacito-square.fullname" . }}-keeper:{{ .Values.keeper.service.port }}"
            - name: TS_BFF_BACKEND_BASE_URL
              value: "http://{{ include "tacito-square.fullname" . }}-keeper:{{ .Values.keeper.service.port }}"
            - name: TS_BFF_OIDC_ISSUER
              value: {{ .Values.bff.config.oidc.issuer | quote }}
            - name: TS_BFF_OIDC_INTERNAL_ISSUER
              value: {{ .Values.bff.config.oidc.internalIssuer | quote }}
            - name: TS_BFF_OIDC_CLIENT_ID
              value: {{ .Values.bff.config.oidc.clientId | quote }}
            - name: TS_BFF_OIDC_CLIENT_SECRET
              value: {{ .Values.bff.config.oidc.clientSecret | quote }}
            - name: TS_BFF_OIDC_REDIRECT_URI
              value: {{ .Values.bff.config.oidc.redirectUri | quote }}
            - name: TS_BFF_REDIS_URL
              value: {{ .Values.bff.config.redis.url | quote }}
            - name: TS_BFF_REDIS_PREFIX
              value: {{ .Values.bff.config.redis.prefix | quote }}
            - name: TS_BFF_OTEL_ENDPOINT
              value: {{ .Values.bff.config.otel.endpoint | quote }}
            - name: TS_BFF_TLS_CA_CERT_PATH
              value: {{ .Values.bff.config.tls.caCertPath | quote }}
          livenessProbe:
            {{- toYaml .Values.bff.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.bff.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.bff.resources | nindent 12 }}
{{- end }}
