apiVersion: v1
kind: Service
metadata:
  name: {{ include "tacito-square.fullname" . }}-keeper
  labels:
    {{- include "tacito-square.labels" (dict "component" "keeper" "context" .) | nindent 4 }}
spec:
  type: {{ .Values.keeper.service.type }}
  ports:
    - port: {{ .Values.keeper.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "tacito-square.selectorLabels" (dict "component" "keeper" "context" .) | nindent 4 }}
