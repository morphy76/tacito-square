{{- if .Values.keeper.config.db.migrate -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tacito-square.fullname" . }}-keeper-migrate
  labels:
    {{- include "tacito-square.labels" (dict "component" "keeper-migrate" "context" .) | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      name: {{ include "tacito-square.fullname" . }}-keeper-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: {{ include "tacito-square.image" (dict "registry" .Values.keeper.image.registry "name" .Values.keeper.image.name "tag" .Values.keeper.image.tag "global" .Values.global) }}
          imagePullPolicy: {{ .Values.keeper.image.pullPolicy }}
          args: ["migrate"]
          env:
            - name: TS_KEEPER_LOG_LEVEL
              value: {{ .Values.keeper.config.logLevel | quote }}
            - name: TS_KEEPER_DB_URL
              value: {{ .Values.keeper.config.db.url | quote }}
            - name: TS_KEEPER_DB_USERNAME
              value: {{ .Values.keeper.config.db.username | quote }}
            - name: TS_KEEPER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tacito-square.fullname" . }}-keeper-db
                  key: password
            - name: TS_KEEPER_MIGRATIONS_DIR
              value: "/app/deploy/postgres/migrations"  # Standard location inside the packaged container image
{{- end }}