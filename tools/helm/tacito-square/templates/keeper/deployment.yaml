apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tacito-square.fullname" . }}-keeper
  labels:
    {{- include "tacito-square.labels" (dict "component" "keeper" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.keeper.replicaCount }}
  selector:
    matchLabels:
      {{- include "tacito-square.selectorLabels" (dict "component" "keeper" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tacito-square.selectorLabels" (dict "component" "keeper" "context" .) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "tacito-square.fullname" . }}-keeper
      containers:
        - name: keeper
          image: {{ include "tacito-square.image" (dict "registry" .Values.keeper.image.registry "name" .Values.keeper.image.name "tag" .Values.keeper.image.tag "global" .Values.global) }}
          imagePullPolicy: {{ .Values.keeper.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.keeper.service.port }}
              protocol: TCP
          env:
            - name: TS_KEEPER_LOG_LEVEL
              value: {{ .Values.keeper.config.logLevel | quote }}
            - name: TS_KEEPER_PORT
              value: {{ .Values.keeper.config.port | toString | quote }}
            - name: TS_KEEPER_DATABASE_URL
              value: {{ .Values.keeper.config.db.url | quote }}
            - name: TS_KEEPER_DB_USERNAME
              value: {{ .Values.keeper.config.db.username | quote }}
            - name: TS_KEEPER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tacito-square.fullname" . }}-keeper-db
                  key: password
            - name: TS_KEEPER_NATS_URL
              value: {{ .Values.keeper.config.nats.url | quote }}
            - name: TS_KEEPER_REDIS_URL
              value: {{ .Values.keeper.config.redis.url | quote }}
            - name: TS_KEEPER_OTEL_ENDPOINT
              value: {{ .Values.keeper.config.otel.endpoint | quote }}
            - name: TS_KEEPER_OIDC_ISSUER
              value: {{ .Values.keeper.config.oidc.issuer | quote }}
            - name: TS_KEEPER_OIDC_CLIENT_ID
              value: {{ .Values.keeper.config.oidc.clientId | quote }}
            - name: TS_KEEPER_S3_ENDPOINT
              value: {{ .Values.keeper.config.s3.endpoint | quote }}
            - name: TS_KEEPER_S3_BUCKET
              value: {{ .Values.keeper.config.s3.bucket | quote }}
            - name: TS_KEEPER_S3_REGION
              value: {{ .Values.keeper.config.s3.region | quote }}
            - name: TS_KEEPER_TLS_CA_CERT_PATH
              value: {{ .Values.keeper.config.tls.caCertPath | quote }}
          livenessProbe:
            {{- toYaml .Values.keeper.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.keeper.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.keeper.resources | nindent 12 }}
          volumeMounts:
            - name: ca-cert
              mountPath: /etc/ssl/tacito
              readOnly: true
      volumes:
        - name: ca-cert
          configMap:
            name: {{ .Values.global.caTrustBundle.configMapName }}
            items:
              - key: {{ .Values.global.caTrustBundle.key }}
                path: ca.crt
