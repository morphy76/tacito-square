{{- if .Values.uiConfigurator.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tacito-square.fullname" . }}-ui-configurator
  labels:
    {{- include "tacito-square.labels" (dict "component" "ui-configurator" "context" .) | nindent 4 }}
spec:
  type: {{ .Values.uiConfigurator.service.type }}
  ports:
    - port: {{ .Values.uiConfigurator.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "tacito-square.selectorLabels" (dict "component" "ui-configurator" "context" .) | nindent 4 }}
{{- end }}
