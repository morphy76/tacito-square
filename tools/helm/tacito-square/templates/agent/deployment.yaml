apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tacito-square.fullname" . }}-agent
  labels:
    {{- include "tacito-square.labels" (dict "component" "agent" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.agent.replicaCount }}
  selector:
    matchLabels:
      {{- include "tacito-square.selectorLabels" (dict "component" "agent" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tacito-square.selectorLabels" (dict "component" "agent" "context" .) | nindent 8 }}
    spec:
      containers:
        - name: agent
          image: {{ include "tacito-square.image" (dict "registry" .Values.agent.image.registry "name" .Values.agent.image.name "tag" .Values.agent.image.tag "global" .Values.global) }}
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.agent.config.port }}
              protocol: TCP
          env:
            - name: TS_AGENT_LOG_LEVEL
              value: {{ .Values.agent.config.logLevel | quote }}
            - name: TS_AGENT_PORT
              value: {{ .Values.agent.config.port | toString | quote }}
            - name: TS_AGENT_NATS_URL
              value: {{ .Values.agent.config.nats.url | quote }}
            - name: TS_AGENT_REDIS_URL
              value: {{ .Values.agent.config.redis.url | quote }}
            - name: TS_AGENT_QDRANT_URL
              value: {{ .Values.agent.config.qdrant.url | quote }}
            - name: TS_AGENT_OTEL_ENDPOINT
              value: {{ .Values.agent.config.otel.endpoint | quote }}
            - name: TS_AGENT_S3_ENDPOINT
              value: {{ .Values.agent.config.s3.endpoint | quote }}
            - name: TS_AGENT_S3_BUCKET
              value: {{ .Values.agent.config.s3.bucket | quote }}
            - name: TS_AGENT_S3_REGION
              value: {{ .Values.agent.config.s3.region | quote }}
            - name: TS_AGENT_CA_CERT_PATH
              value: {{ .Values.agent.config.tls.caCertPath | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
