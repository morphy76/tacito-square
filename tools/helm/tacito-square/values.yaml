# Tacito Square — Application Helm values
# Infrastructure bindings: configure these to point at your infrastructure release.
# Default values assume infra release name "tacito-infra" in the same namespace.
# All connections use TLS-secured endpoints.

# --- Global ---
global:
  imageRegistry: ""
  imagePullSecrets: []
  # Infrastructure release name — used to derive default service hostnames.
  infraReleaseName: "tacito-infra"
  # CA trust bundle — ConfigMap created by the infra chart TLS generator.
  # Mount this in application pods to trust infrastructure service certificates.
  caTrustBundle:
    configMapName: "tacito-infra-ca-bundle"
    key: "ca.crt"

# --- Keeper ---
keeper:
  replicaCount: 1
  image:
    registry: ""   # override global.imageRegistry per component
    name: tacito-square/keeper
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  env:
    TS_KEEPER_LOG_LEVEL: info
    TS_KEEPER_PORT: "8080"
    # Infrastructure bindings (defaults assume infra release = tacito-infra)
    TS_KEEPER_DB_HOST: "tacito-infra-postgresql"
    TS_KEEPER_DB_PORT: "5432"
    TS_KEEPER_DB_NAME: tacito
    TS_KEEPER_DB_USER: tacito
    TS_KEEPER_DB_SSLMODE: "require"
    TS_KEEPER_NATS_URL: "nats://tacito-infra-nats:4222"
    TS_KEEPER_REDIS_URL: "rediss://tacito-infra-redis:6379"
    TS_KEEPER_OTEL_ENDPOINT: "tacito-infra-otel-collector:4317"
    TS_KEEPER_OIDC_ISSUER: "https://tacito-infra-keycloak-http:8443/realms/tacito"
    TS_KEEPER_OIDC_CLIENT_ID: tacito-keeper
    TS_KEEPER_S3_ENDPOINT: "https://tacito-infra-minio:9000"
    TS_KEEPER_S3_BUCKET: tacito
    TS_KEEPER_S3_REGION: us-east-1
    TS_KEEPER_CA_CERT_PATH: "/etc/ssl/tacito/ca.crt"
  service:
    type: ClusterIP
    port: 8080

# --- Agent (default template) ---
agent:
  replicaCount: 0  # agents are spawned dynamically by the operator
  image:
    registry: ""
    name: tacito-square/agent
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    TS_AGENT_LOG_LEVEL: info
    TS_AGENT_PORT: "8081"
    TS_AGENT_NATS_URL: "nats://tacito-infra-nats:4222"
    TS_AGENT_REDIS_URL: "rediss://tacito-infra-redis:6379"
    TS_AGENT_QDRANT_URL: "http://tacito-infra-qdrant:6334"
    TS_AGENT_OTEL_ENDPOINT: "tacito-infra-otel-collector:4317"
    TS_AGENT_S3_ENDPOINT: "https://tacito-infra-minio:9000"
    TS_AGENT_S3_BUCKET: tacito
    TS_AGENT_S3_REGION: us-east-1
    TS_AGENT_CA_CERT_PATH: "/etc/ssl/tacito/ca.crt"

# --- Operator ---
operator:
  enabled: false  # enabled in M4
  replicaCount: 1
  image:
    registry: ""
    name: tacito-square/operator
    tag: "0.1.0"
    pullPolicy: IfNotPresent

# --- BFF ---
bff:
  enabled: false  # enabled in M7
  replicaCount: 1
  image:
    registry: ""
    name: tacito-square/bff
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  env:
    TS_BFF_LOG_LEVEL: info
    TS_BFF_PORT: "8083"
    TS_BFF_KEEPER_URL: "http://tacito-square-keeper:8080"
    TS_BFF_OIDC_ISSUER: "https://tacito-infra-keycloak-http:8443/realms/tacito"
    TS_BFF_OIDC_CLIENT_ID: tacito-ui
    TS_BFF_CA_CERT_PATH: "/etc/ssl/tacito/ca.crt"
  service:
    type: ClusterIP
    port: 8083
