# Tacito Square — Application Helm values
# Infrastructure bindings: configure these to point at your infrastructure release.
# Default values assume infra release name "tacito-infra" in the same namespace.
# All connections use TLS-secured endpoints.

# --- Global ---
global:
  imageRegistry: ""
  imagePullSecrets: []
  # CA trust bundle — ConfigMap created by the infra chart TLS generator.
  # Mount this in application pods to trust infrastructure service certificates.
  caTrustBundle:
    configMapName: "ts-infra-tacito-square-infra-ca-bundle"
    key: "ca.crt"

# --- Keeper ---
keeper:
  replicaCount: 1
  image:
    registry: ""   # override global.imageRegistry per component
    name: tacito-square/keeper
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 1
    periodSeconds: 1
  readinessProbe:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 1
    periodSeconds: 1
  config:
    logLevel: debug
    port: 8080
    db:
      url: "postgres://tacito-infra-postgresql:5432/tacito?sslmode=require&sslrootcert=/etc/ssl/tacito/ca.crt"
      username: tacito
      password: ""
      migrate: true
    nats:
      url: "nats://tacito-infra-nats:4222"
    redis:
      url: "rediss://tacito-infra-redis:6379"
    otel:
      endpoint: "tacito-infra-otel-collector:4317"
    oidc:
      issuer: "https://tacito-infra-keycloak-http:8443/realms/tacito"
      clientId: tacito-keeper
    s3:
      endpoint: "https://tacito-infra-minio:9000"
      bucket: tacito
      region: us-east-1
    tls:
      caCertPath: "/etc/ssl/tacito/ca.crt"
  service:
    type: ClusterIP
    port: 8080

# --- Agent (default template) ---
agent:
  enabled: false
  replicaCount: 0  # agents are spawned dynamically by the operator
  image:
    registry: ""
    name: tacito-square/agent
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  config:
    logLevel: info
    port: 8081
    nats:
      url: "nats://tacito-infra-nats:4222"
    redis:
      url: "rediss://tacito-infra-redis:6379"
    qdrant:
      url: "http://tacito-infra-qdrant:6334"
    otel:
      endpoint: "tacito-infra-otel-collector:4317"
    s3:
      endpoint: "https://tacito-infra-minio:9000"
      bucket: tacito
      region: us-east-1
    tls:
      caCertPath: "/etc/ssl/tacito/ca.crt"

# --- Agent Tiers ---
agentTiers:
  configs:
    heavy:
      image:
        registry: ""
        name: tacito-square/agent
        tag: "0.1.0"
        pullPolicy: Always
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: 2000m
          memory: 2Gi
      livenessProbe:
        initialDelaySeconds: 15
        periodSeconds: 20
      readinessProbe:
        initialDelaySeconds: 15
        periodSeconds: 20

# --- Operator ---
operator:
  enabled: true
  replicaCount: 1
  image:
    registry: ""
    name: tacito-square/operator
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 1
    periodSeconds: 1
  readinessProbe:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 1
    periodSeconds: 1
  config:
    logLevel: info
    port: 8082
    otel:
      endpoint: "tacito-infra-otel-collector:4317"
    nats:
      url: "nats://tacito-infra-nats:4222"
    tls:
      caCertPath: "/etc/ssl/tacito/ca.crt"

# --- BFF ---
bff:
  enabled: false  # enabled in M7
  replicaCount: 1
  image:
    registry: ""
    name: tacito-square/bff
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  config:
    logLevel: info
    port: 8083
    keeperUrl: "http://tacito-square-keeper:8080"
    oidc:
      issuer: "https://tacito-infra-keycloak-http:8443/realms/tacito"
      clientId: tacito-ui
    tls:
      caCertPath: "/etc/ssl/tacito/ca.crt"
  service:
    type: ClusterIP
    port: 8083
