apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tacitoagents.tacito.square.io
  labels:
    app.kubernetes.io/part-of: tacito-square
spec:
  group: tacito.square.io
  names:
    kind: TacitoAgent
    listKind: TacitoAgentList
    plural: tacitoagents
    singular: tacitoagent
    shortNames:
      - ta
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: TacitoAgent represents a managed AI agent instance.
          properties:
            spec:
              type: object
              description: Desired state of the TacitoAgent.
              required:
                - tenantId
                - agentName
                - communityRef
                - llmConfig
              properties:
                tenantId:
                  type: string
                  minLength: 1
                  description: Identifier of the tenant owning this agent.
                agentName:
                  type: string
                  minLength: 1
                  description: Unique name of the agent.
                communityRef:
                  type: string
                  minLength: 1
                  description: Reference to the parent community.
                llmConfig:
                  type: object
                  description: LLM parameters for the agent brain.
                  required:
                    - model
                  properties:
                    model:
                      type: string
                      minLength: 1
                      description: LLM model identifier (e.g. gpt-4o, gemini-1.5-pro).
                    temperature:
                      type: string
                      pattern: "^[0-9]+(\\.[0-9]+)?$"
                      default: "0.7"
                      description: Randomness of LLM output (string-encoded decimal).
                    maxTokens:
                      type: integer
                      minimum: 1
                      maximum: 8192
                      default: 2048
                      description: Maximum number of tokens the LLM can generate.
                    endpoint:
                      type: string
                      description: Custom target endpoint for OpenAI requests.
                    credentialsSecret:
                      type: string
                      description: Secret reference or raw secret API key.
                systemPrompt:
                  type: string
                  description: Fully synthesized system prompt for the agent.
                replicas:
                  type: integer
                  minimum: 0
                  maximum: 10
                  default: 1
                  description: Desired number of agent pod replicas.
                resources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: CPU and memory resource requirements.
            status:
              type: object
              description: Observed state of the TacitoAgent.
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Running
                    - Idle
                    - Terminated
                  description: Current lifecycle phase of the agent.
                conditions:
                  type: array
                  description: Latest available observations of the agent state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                        description: Type of condition (e.g. Available, Reconciling, Failed).
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        description: Status of the condition.
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: Last time the condition transitioned.
                      reason:
                        type: string
                        description: Machine-readable reason for the condition.
                      message:
                        type: string
                        description: Human-readable message for the condition.
                      observedGeneration:
                        type: integer
                        format: int64
                        description: Generation observed when the condition was set.
                lastHeartbeat:
                  type: string
                  format: date-time
                  description: Timestamp of the last agent heartbeat.
                selector:
                  type: string
                  description: Label selector for scaling.
                replicas:
                  type: integer
                  description: Current number of running replicas.
      subresources:
        status: {}
        scale:
          specReplicasPath: .spec.replicas
          statusReplicasPath: .status.replicas
          labelSelectorPath: .status.selector
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Tenant
          type: string
          jsonPath: .spec.tenantId
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
