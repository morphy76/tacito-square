<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Secure area for Tacito Square BFF - The gateway and orchestration layer for the Tacito Square agent community." />
  <title>Tacito Square BFF - Secure Zone</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  
  <!-- Premium Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --color-bg: #0b0c10;
      --color-card-bg: rgba(20, 22, 30, 0.65);
      --color-card-border: rgba(226, 232, 240, 0.08);
      --color-text-primary: #f2f5f9;
      --color-text-secondary: #94a3b8;
      
      /* Piazza Tacito Color Palette */
      --color-steel: #e2e8f0;
      --color-steel-glow: #00f2fe;
      --color-porphyry-red: #c82c3c;
      --color-porphyry-glow: #ff5e62;
      --color-water: #1e3c72;
      --color-water-glow: #2a5298;
      
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
      
      --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--color-bg);
      color: var(--color-text-primary);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Background Elements */
    .ambient-bg {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 80% 20%, rgba(200, 44, 60, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 20% 80%, rgba(30, 60, 114, 0.18) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(11, 12, 16, 1) 0%, rgba(5, 5, 8, 1) 100%);
      z-index: 1;
    }

    .pennone-mast {
      position: absolute;
      top: 0;
      left: 50%;
      width: 2px;
      height: 100%;
      background: linear-gradient(to bottom, 
        transparent 0%, 
        rgba(0, 242, 254, 0.15) 20%, 
        rgba(0, 242, 254, 0.35) 50%, 
        rgba(200, 44, 60, 0.25) 80%, 
        transparent 100%
      );
      transform: translateX(-50%);
      z-index: 2;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.25);
    }

    .zodiac-container {
      position: absolute;
      width: 700px;
      height: 700px;
      opacity: 0.18;
      z-index: 2;
      pointer-events: none;
      animation: rotateRing 180s linear infinite;
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Glassmorphism Dashboard Card */
    .glass-card {
      position: relative;
      width: 100%;
      max-width: 600px;
      background: var(--color-card-bg);
      border: 1px solid var(--color-card-border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 
        0 4px 30px rgba(0, 0, 0, 0.4),
        inset 0 1px 2px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 10;
      margin: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: var(--transition-smooth);
    }

    .glass-card:hover {
      border-color: rgba(200, 44, 60, 0.25);
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.5),
        0 0 40px rgba(200, 44, 60, 0.05),
        inset 0 1px 2px rgba(255, 255, 255, 0.08);
    }

    /* Logo / Monument Header */
    .monument-header {
      position: relative;
      margin-bottom: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 80px;
      height: 80px;
    }

    .fountain-outer-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px dashed rgba(200, 44, 60, 0.8);
      border-radius: 50%;
      animation: spinCounter 40s linear infinite;
    }

    .fountain-inner-ring {
      position: absolute;
      width: 75%;
      height: 75%;
      border: 1px solid rgba(0, 242, 254, 0.6);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200, 44, 60, 0.2) 0%, transparent 70%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .steel-mast-core {
      width: 10px;
      height: 40px;
      background: linear-gradient(to top, var(--color-porphyry-red), var(--color-steel));
      border-radius: 4px;
      box-shadow: 0 0 15px var(--color-porphyry-glow);
      animation: pulseMast 4s ease-in-out infinite;
    }

    @keyframes spinCounter {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    @keyframes pulseMast {
      0%, 100% { transform: scaleY(1); opacity: 0.8; }
      50% { transform: scaleY(1.2); opacity: 1; filter: brightness(1.2); }
    }

    /* Typography */
    h1 {
      font-family: var(--font-heading);
      font-size: 2.25rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--color-steel) 30%, #a1aab8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-family: var(--font-heading);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--color-steel-glow);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 20px;
    }

    .secure-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(200, 44, 60, 0.15);
      border: 1px solid rgba(200, 44, 60, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--color-porphyry-glow);
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    p.description {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--color-text-secondary);
      margin-bottom: 36px;
      max-width: 480px;
    }

    /* Form and Submit Button */
    form {
      width: 100%;
    }

    .logout-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      background: rgba(200, 44, 60, 0.05);
      border: 1px solid rgba(200, 44, 60, 0.15);
      border-radius: 14px;
      color: var(--color-text-primary);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-smooth);
      position: relative;
      overflow: hidden;
    }

    .logout-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, rgba(200, 44, 60, 0.2), rgba(255, 94, 98, 0.1));
      opacity: 0;
      transition: var(--transition-smooth);
      z-index: 1;
    }

    .logout-btn:hover {
      background: rgba(200, 44, 60, 0.08);
      border-color: rgba(200, 44, 60, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(200, 44, 60, 0.15);
    }

    .logout-btn:hover::before {
      opacity: 1;
    }

    .logout-btn:active {
      transform: translateY(0);
    }

    .btn-label {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
    }

    .btn-title {
      font-weight: 600;
    }

    .btn-subtitle {
      font-size: 0.75rem;
      color: var(--color-text-secondary);
      margin-top: 2px;
    }

    .btn-arrow {
      position: relative;
      z-index: 2;
      font-size: 1.25rem;
      color: var(--color-text-secondary);
      transition: var(--transition-smooth);
    }

    .logout-btn:hover .btn-arrow {
      color: var(--color-porphyry-glow);
      transform: translateX(4px);
    }

    /* Footer Credits */
    .credits {
      font-size: 0.75rem;
      color: rgba(148, 163, 184, 0.5);
      margin-top: 36px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .credits a {
      color: rgba(148, 163, 184, 0.7);
      text-decoration: none;
      transition: var(--transition-smooth);
    }

    .credits a:hover {
      color: var(--color-steel-glow);
    }
  </style>
</head>
<body>

  <!-- Ambient background elements -->
  <div class="ambient-bg"></div>
  <div class="pennone-mast"></div>
  
  <!-- Zodiac constellation background pattern -->
  <svg class="zodiac-container" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.5" />
    <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.25" stroke-dasharray="2 2" />
    
    <!-- Gemini -->
    <g stroke="rgba(255,255,255,0.25)" stroke-width="0.2" fill="rgba(255,255,255,0.8)">
      <line x1="25" y1="35" x2="30" y2="30" />
      <line x1="30" y1="30" x2="35" y2="35" />
      <line x1="25" y1="35" x2="28" y2="40" />
      <line x1="28" y1="40" x2="33" y2="45" />
      <circle cx="25" cy="35" r="0.6" />
      <circle cx="30" cy="30" r="0.6" />
      <circle cx="35" cy="35" r="0.6" />
      <circle cx="28" cy="40" r="0.6" />
      <circle cx="33" cy="45" r="0.6" />
    </g>

    <!-- Taurus -->
    <g stroke="rgba(255,255,255,0.25)" stroke-width="0.2" fill="rgba(255,255,255,0.8)">
      <line x1="65" y1="25" x2="72" y2="28" />
      <line x1="72" y1="28" x2="78" y2="22" />
      <line x1="72" y1="28" x2="70" y2="35" />
      <line x1="70" y1="35" x2="63" y2="38" />
      <circle cx="65" cy="25" r="0.6" />
      <circle cx="72" cy="28" r="0.8" />
      <circle cx="78" cy="22" r="0.6" />
      <circle cx="70" cy="35" r="0.6" />
      <circle cx="63" cy="38" r="0.6" />
    </g>
  </svg>

  <!-- Central Glassmorphism Card -->
  <main class="glass-card">
    
    <!-- Stylized Fountain Monument Icon -->
    <div class="monument-header">
      <div class="fountain-outer-ring"></div>
      <div class="fountain-inner-ring">
        <div class="steel-mast-core"></div>
      </div>
    </div>

    <h1>Tacito Square BFF</h1>
    <div class="subtitle">Secure Zone</div>
    
    <div class="secure-badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      Authenticated
    </div>
    
    <p class="description">
      You are currently logged into the protected backend interface of Tacito Square. Your OIDC authentication token is active and secure.
    </p>

    <!-- Logout control -->
    <form action="../api/v1/auth/logout" method="POST">
      <button type="submit" id="btn-logout" class="logout-btn">
        <div class="btn-label">
          <span class="btn-title">Secure Logout</span>
          <span class="btn-subtitle">Terminate OIDC session</span>
        </div>
        <span class="btn-arrow">&#8594;</span>
      </button>
    </form>

    <!-- Footer -->
    <div class="credits">
      Inspired by Terni, Italy &bull; <a href="https://github.com/morphy76/tacito-square" target="_blank" rel="noopener">Tacito Square</a>
    </div>

  </main>

</body>
</html>
