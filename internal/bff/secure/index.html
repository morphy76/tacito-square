<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Secure area for Tacito Square BFF - The gateway and orchestration layer for the Tacito Square agent community." />
  <title>Tacito Square BFF - Secure Zone</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico" />

  <!-- Premium Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;800&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="/ui/assets/bootstrap-theme.css" />
</head>

<body class="theme-applied">

  <!-- Ambient background elements -->
  <div class="ambient-bg"></div>
  <div class="pennone-mast"></div>

  <!-- Zodiac constellation background pattern -->
  <svg class="zodiac-container" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.5" />
    <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.25"
      stroke-dasharray="2 2" />

    <!-- Gemini -->
    <g stroke="rgba(255,255,255,0.25)" stroke-width="0.2" fill="rgba(255,255,255,0.8)">
      <line x1="25" y1="35" x2="30" y2="30" />
      <line x1="30" y1="30" x2="35" y2="35" />
      <line x1="25" y1="35" x2="28" y2="40" />
      <line x1="28" y1="40" x2="33" y2="45" />
      <circle cx="25" cy="35" r="0.6" />
      <circle cx="30" cy="30" r="0.6" />
      <circle cx="35" cy="35" r="0.6" />
      <circle cx="28" cy="40" r="0.6" />
      <circle cx="33" cy="45" r="0.6" />
    </g>

    <!-- Taurus -->
    <g stroke="rgba(255,255,255,0.25)" stroke-width="0.2" fill="rgba(255,255,255,0.8)">
      <line x1="65" y1="25" x2="72" y2="28" />
      <line x1="72" y1="28" x2="78" y2="22" />
      <line x1="72" y1="28" x2="70" y2="35" />
      <line x1="70" y1="35" x2="63" y2="38" />
      <circle cx="65" cy="25" r="0.6" />
      <circle cx="72" cy="28" r="0.8" />
      <circle cx="78" cy="22" r="0.6" />
      <circle cx="70" cy="35" r="0.6" />
      <circle cx="63" cy="38" r="0.6" />
    </g>
  </svg>

  <!-- Central Glassmorphism Card -->
  <main class="glass-card">

    <!-- Stylized Fountain Monument Icon -->
    <div class="monument-header">
      <div class="fountain-outer-ring"></div>
      <div class="fountain-inner-ring">
        <div class="steel-mast-core"></div>
      </div>
    </div>

    <h1>Tacito Square BFF</h1>
    <div class="subtitle">Secure Zone</div>

    <div class="secure-badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      Authenticated
    </div>

    <p class="description">
      You are currently logged into the protected backend interface of Tacito Square. Your OIDC authentication token is
      active and secure.
    </p>

    <!-- Logout control -->
    <form action="../api/v1/auth/logout" method="POST">
      <button type="submit" id="btn-logout" class="logout-btn">
        <div class="btn-label">
          <span class="btn-title">Secure Logout</span>
          <span class="btn-subtitle">Terminate OIDC session</span>
        </div>
        <span class="btn-arrow">&#8594;</span>
      </button>
    </form>

    <!-- Footer -->
    <div class="credits">
      Inspired by Terni, Italy &bull; <a href="https://github.com/morphy76/tacito-square" target="_blank"
        rel="noopener">Tacito Square</a>
    </div>

  </main>

</body>

</html>
